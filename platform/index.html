<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var t = localStorage.getItem("trace:theme");
        var r =
          t === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : t === "light"
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = r;
        document.documentElement.classList.toggle("dark", r === "dark");
        document.documentElement.style.colorScheme = r;
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Learn algorithms by exploring real execution, comparing approaches, and testing your understanding."
    />
    <link rel="icon" href="/favicon.svg" />
    <title>Trace — Understand the algorithm</title>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/web/main.tsx"></script>
  </body>
</html>
